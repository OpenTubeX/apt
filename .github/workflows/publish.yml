name: Publish APT repository

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to publish (for example, v0.29.0-beta). Leave empty for the latest releases.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  # Pages can skip a deployment whose build version it deployed before, and it
  # only accepts a commit SHA as that version. A release or nightly dispatch runs
  # on the same main commit as the previous deploy, so every run deploys a new
  # commit with main's tree, kept on the pages-builds branch.
  build-version:
    name: Create Pages build commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Create Pages build commit
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data: head } = await github.rest.git.getCommit({ ...context.repo, commit_sha: context.sha })
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: `Pages build for run ${context.runId}`,
              tree: head.tree.sha,
              parents: [context.sha],
            })
            try {
              await github.rest.git.updateRef({ ...context.repo, ref: 'heads/pages-builds', sha: commit.sha, force: true })
            } catch (error) {
              if (error.status !== 422) throw error
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/heads/pages-builds', sha: commit.sha })
            }
            core.setOutput('sha', commit.sha)

  publish:
    name: Publish repositories
    needs: build-version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve releases
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          set -euo pipefail
          stable_tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          nightly_tag="$(gh release list --repo OpenTubeX/OpenTubeX --limit 100 \
            --json isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$")))] | sort_by(.publishedAt) | last | .tagName // ""')"

          # Release listings can lag behind, so the dispatched tag takes precedence.
          if [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            stable_tag="$REQUESTED_TAG"
          elif [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+$ ]]; then
            nightly_tag="$REQUESTED_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            echo "Expected a stable or nightly OpenTubeX tag, got: $REQUESTED_TAG" >&2
            exit 1
          fi

          if [[ ! "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            echo "Expected a stable tag, got: $stable_tag" >&2
            exit 1
          fi

          # The nightly suite follows whichever of the two was published last.
          published_at() {
            gh release view "$1" --repo OpenTubeX/OpenTubeX --json publishedAt --jq .publishedAt
          }
          if [[ -z "$nightly_tag" || "$(published_at "$stable_tag")" > "$(published_at "$nightly_tag")" ]]; then
            nightly_tag="$stable_tag"
          fi

          {
            echo "stable_tag=$stable_tag"
            echo "nightly_tag=$nightly_tag"
          } >> "$GITHUB_OUTPUT"

      # Release lookups by tag can omit newly uploaded assets, so download directly.
      - name: Download Debian packages
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local tag=$1 directory=$2 version=${1#v}
            version=${version/%-beta/_beta}
            mkdir -p "$directory"
            for arch in amd64 arm64; do
              # wget gives up on some network errors despite --tries; curl retries every failure.
              curl --fail --silent --show-error --location \
                --retry 5 --retry-all-errors --retry-delay 30 \
                --output "$directory/opentubex_${version}_${arch}.deb" \
                "https://github.com/OpenTubeX/OpenTubeX/releases/download/${tag}/opentubex_${version}_${arch}.deb"
            done
          }

          download "$STABLE_TAG" release-files
          if [[ "$NIGHTLY_TAG" == "$STABLE_TAG" ]]; then
            cp --recursive release-files nightly-files
          else
            download "$NIGHTLY_TAG" nightly-files
          fi

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils

      - name: Import signing key
        id: signing-key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APT_GPG_PRIVATE_KEY" ]]; then
            echo 'The APT_GPG_PRIVATE_KEY secret is not configured.' >&2
            exit 1
          fi

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"

          if [[ -z "$fingerprint" ]]; then
            echo 'No private signing key was imported.' >&2
            exit 1
          fi

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build signed repository
        env:
          APT_GPG_KEY_ID: ${{ steps.signing-key.outputs.fingerprint }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: ./scripts/build-repository.sh release-files repository nightly-files

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload repository
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository

      # actions/deploy-pages always uses the run's commit SHA as the build version.
      - name: Deploy repository
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BUILD_VERSION: ${{ needs.build-version.outputs.sha }}
        with:
          retries: 3
          script: |
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: process.env.BUILD_VERSION,
              oidc_token: await core.getIDToken(),
            })
            const id = deployment.id ?? deployment.status_url.split('/').pop()
            core.setOutput('page_url', deployment.page_url)
            const deadline = Date.now() + 20 * 60 * 1000
            let status
            do {
              if (Date.now() > deadline) throw new Error(`Pages deployment ${id} timed out in ${status}`)
              await new Promise(resolve => setTimeout(resolve, 10000))
              ;({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { ...context.repo, id }))
              core.info(`Pages deployment ${id}: ${status}`)
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error(`Pages deployment ${id} ended with ${status}`)
              }
            } while (status !== 'succeed')
