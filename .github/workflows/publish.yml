name: Publish APT repository

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Publish repositories
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve releases
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          stable_tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          nightly_tag="$(gh release list --repo OpenTubeX/OpenTubeX --limit 100 \
            --json isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$")))] | sort_by(.publishedAt) | last | .tagName // ""')"

          # Release listings can lag behind, so the dispatched tag takes precedence.
          if [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            stable_tag="$REQUESTED_TAG"
          elif [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+$ ]]; then
            nightly_tag="$REQUESTED_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            echo "Expected a stable or nightly OpenTubeX tag, got: $REQUESTED_TAG" >&2
            exit 1
          fi

          if [[ ! "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            echo "Expected a stable tag, got: $stable_tag" >&2
            exit 1
          fi

          # The nightly suite follows whichever of the two was published last.
          published_at() {
            gh release view "$1" --repo OpenTubeX/OpenTubeX --json publishedAt --jq .publishedAt
          }
          if [[ -z "$nightly_tag" || "$(published_at "$stable_tag")" > "$(published_at "$nightly_tag")" ]]; then
            nightly_tag="$stable_tag"
          fi

          {
            echo "stable_tag=$stable_tag"
            echo "nightly_tag=$nightly_tag"
          } >> "$GITHUB_OUTPUT"

      # Release lookups by tag can omit newly uploaded assets, so download directly.
      - name: Download Debian packages
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local tag=$1 directory=$2 version=${1#v}
            version=${version/%-beta/_beta}
            mkdir -p "$directory"
            for arch in amd64 arm64; do
              wget --quiet --tries=3 --directory-prefix="$directory" \
                "https://github.com/OpenTubeX/OpenTubeX/releases/download/${tag}/opentubex_${version}_${arch}.deb"
            done
          }

          download "$STABLE_TAG" release-files
          if [[ "$NIGHTLY_TAG" == "$STABLE_TAG" ]]; then
            cp --recursive release-files nightly-files
          else
            download "$NIGHTLY_TAG" nightly-files
          fi

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils

      - name: Import signing key
        id: signing-key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APT_GPG_PRIVATE_KEY" ]]; then
            echo 'The APT_GPG_PRIVATE_KEY secret is not configured.' >&2
            exit 1
          fi

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"

          if [[ -z "$fingerprint" ]]; then
            echo 'No private signing key was imported.' >&2
            exit 1
          fi

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build signed repository
        env:
          APT_GPG_KEY_ID: ${{ steps.signing-key.outputs.fingerprint }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: ./scripts/build-repository.sh release-files repository nightly-files

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository

      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
